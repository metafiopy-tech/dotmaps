name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[dev]
      - run: pytest -q
      - name: replay smoke (bundled journals, offline)
        run: |
          dotmaps replay runs/repro-3b-circular | head -5
          dotmaps replay runs/grow-001 | head -5
