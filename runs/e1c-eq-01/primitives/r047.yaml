statement: Writing a JSON array with an object containing a body field with an escaped
  href to target_items.json preserves the JSON-escaped substring 'href=\"/summer-scoring-camp\"'
  when read back
steps:
- tool: filesystem.write_file
  args:
    path: target_items.json
    content: '[{"slug": "test-link3", "body": "See also <a href=\"/summer-scoring-camp\">summer
      camp</a>."}]'
- tool: filesystem.read_file
  args:
    path: target_items.json
expect:
  predicate: contains
  value: href=\"/summer-scoring-camp\"
